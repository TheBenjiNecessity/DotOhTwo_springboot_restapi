services:
    app:
        build: .
        ports:
            - "8080:8080"
        environment:
            SPRING_PROFILES_ACTIVE: docker,nosec
            SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dotohtwo
            SPRING_DATASOURCE_USERNAME: postgres
            SPRING_DATASOURCE_PASSWORD: postgres
            SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        networks:
            default:
                aliases:
                    - user-reviewable-api

networks:
    default:
        name: dotohtwolocalinfra
        external: true
